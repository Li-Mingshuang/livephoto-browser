[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建**必须**开这个 feature。
#
# tauri 的 build.rs 里写着 `let dev = !custom_protocol;` ——
# 也就是说"是不是 dev 模式"**不是**由 release profile 决定的，而是由这个 feature 决定的。
# 缺了它，release 二进制会照样去连 devUrl（http://localhost:1420）：
# 前端一关就窗口白屏、且没有任何报错。
# 我在这上面白跑了两轮 28 分钟的构建，因为当时以为是前端或 CORS 问题。
#
# 推论：不能只跑 `cargo build --release`，必须带 `--features custom-protocol`，
# 或者用 `pnpm tauri build`（CLI 会自动加）。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
livephoto-core = { path = "../../core" }

# 注意：release / bench profile 必须定义在工作区根的 Cargo.toml，
# 写在成员 crate 里会被 cargo 忽略（并给出警告）。
